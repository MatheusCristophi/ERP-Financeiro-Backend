spring:
  application:
    name: manager
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    schemas: public
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history

server:
  port: ${PORT:8080}
JWT_SECRET: ${JWT_SEGREDO}